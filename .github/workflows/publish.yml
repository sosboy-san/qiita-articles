# Please set 'QIITA_TOKEN' secret to your repository
name: Publish articles

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish_articles:
    # 登録完了の確認後にRepository variableをtrueへ変更する。
    if: github.ref == 'refs/heads/main' && vars.QIITA_PUBLISH_ENABLED == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check token registration
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
        run: |
          if [ -z "$QIITA_TOKEN" ]; then
            echo '::error::QIITA_TOKEN repository secret is required.'
            exit 1
          fi
      - name: Check article presence
        id: articles
        run: |
          if find public -maxdepth 1 -name '*.md' -print -quit | grep -q .; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: increments/qiita-cli/actions/publish@v1.10.0
        if: steps.articles.outputs.present == 'true'
        with:
          qiita-token: ${{ secrets.QIITA_TOKEN }}
          root: "."
